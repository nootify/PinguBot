[tool.poetry]
name = "pingubot"
version = "2.3"
description = ""
authors = ["nootify"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4"
python-dotenv = "^1.0.1"
"discord.py" = {extras = ["voice"], version = "^2.5.2"}
jishaku = "^2.6.0"
wavelink = "^3.4.1"
psutil = "^7.0.0"
pytz = "^2025.1"
pytimeparse = "^1.1.8"
SQLAlchemy = "^2.0.38"
asyncpg = "^0.30.0"
arrow = "^1.3.0"
humanize = "^4.12.1"
playwright = "^1.50.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.2"
black = "^25.1.0"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
